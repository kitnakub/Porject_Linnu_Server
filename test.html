<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>student-code-hub — Rice Desktop UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#3ddc97;
    --mint-dim:rgba(61,220,151,0.16);
    --yellow:#f2c14e;
    --green:#48c78e;
    --red:#ef5b5b;
    --blue:#5aa9ff;
    --text:#eef4f1;
    --text-dim:#93a39c;
    --panel:rgba(10,16,15,0.82);
    --panel-border:rgba(255,255,255,0.09);
    --card:rgba(255,255,255,0.045);
    --card-border:rgba(255,255,255,0.09);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); scrollbar-width:none; -ms-overflow-style:none;}
  html::-webkit-scrollbar, body::-webkit-scrollbar{display:none;}
  *,*::before,*::after{box-sizing:inherit; margin:0; padding:0;}
  body{
    font-family:'Inter',sans-serif;
    color:var(--text);
    min-height:100%;
    scrollbar-width:none;
    -ms-overflow-style:none;
    zoom:1.25;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 50% at 50% 0%, rgba(255,182,120,0.18), transparent 60%),
      linear-gradient(180deg,#0c1c22 0%, #163038 30%, #274a4f 55%, #3c5f57 72%, #4d6b57 100%);
    background-attachment:fixed;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  svg.i{display:block; flex:none;}
  button{font:inherit; cursor:pointer;}

  /* ---------------- top bar ---------------- */
  .topbar{position:sticky; top:env(safe-area-inset-top,0%);z-index:50; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; padding:12px 14px;}
  .topbar-group{display:flex; gap:8px; flex-wrap:wrap;position: relative;}
  .pill{display:flex; align-items:center; gap:8px; background:rgba(8,14,13,0.6); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:7px 10px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font-size:11.5px; color:var(--text-dim);}
  .pill.tight{padding:6px 8px;}
  .pill button.icon-btn{background:none; border:none; color:var(--text-dim); display:flex; align-items:center; padding:2px; position:relative;}
  .ticker-pill{min-width:20px;}
  .ticker-track{position:relative; height:3px; width:100%; background:rgba(255,255,255,0.12); border-radius:99px; margin-top:5px; overflow:hidden;}
  .ticker-fill{position:absolute; inset:0; width:34%; background:var(--mint); border-radius:99px;}
  .clock-num{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--text); font-weight:600;}
  .tray-badge{font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:700; padding:5px 9px; border-radius:8px; background:rgba(255,255,255,0.06); color:var(--text-dim);}
  .tray-badge.ok{background:var(--mint-dim); color:var(--mint);}
  .notif-dot{position:absolute; top:0; right:0; width:7px; height:7px; border-radius:50%; background:var(--red); border:1.5px solid #0d1512;}

  /* dropdowns for search / bell */
  .dropdown{position:absolute; top:calc(100% + 8px); right:0; left: auto; width:280px; max-height:340px; overflow-y:auto; background:#0d1512; border:1px solid rgba(255,255,255,0.12); border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,0.5); z-index:120; display:none; padding:8px;}
  .dropdown.open{display:block;}
  .dropdown input{width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--card-border); border-radius:9px; padding:8px 10px; color:var(--text); font-size:12px; margin-bottom:8px; font-family:'Inter',sans-serif;}
  .dd-item{display:block; width:100%; text-align:left; background:none; border:none; padding:8px 8px; border-radius:8px; color:var(--text); font-size:11.5px;}
  .dd-item:hover{background:rgba(255,255,255,0.06);}
  .dd-item .tt{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:11.5px;}
  .dd-item .ss{color:var(--text-dim); font-size:10.5px; margin-top:2px;}
  .dd-empty{padding:14px 8px; text-align:center; color:var(--text-dim); font-size:11.5px;}

  /* ---------------- role switcher ---------------- */
  .role-switch{display:flex; justify-content:center; gap:6px; padding:6px 14px 20px;}
  .role-switch button{font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600; color:var(--text-dim); background:rgba(8,14,13,0.5); border:1px solid rgba(255,255,255,0.08); padding:8px 16px; border-radius:100px;}
  .role-switch button.active{background:var(--mint); color:#04120c; border-color:var(--mint);}

  /* ---------------- main floating panel ---------------- */
  .stage{display:flex; justify-content:center; padding:0 14px 60px;}
  .panel{width:100%; max-width:1060px; background:var(--panel); border:1px solid var(--panel-border); border-radius:22px; backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); box-shadow:0 20px 60px rgba(0,0,0,0.4); display:grid; grid-template-columns:190px 1fr; overflow:hidden;}
  @media(max-width:680px){ .panel{grid-template-columns:1fr;} .sidebar{display:none;} .mobile-nav-toggle{display:flex;} }

  .sidebar{padding:18px 12px; border-right:1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; gap:2px;}
  .brand{display:flex; align-items:center; gap:10px; padding:6px 8px 20px;}
  .brand .mark{width:32px; height:32px; border-radius:9px; background:var(--mint); display:flex; align-items:center; justify-content:center; color:#04120c; flex:none;}
  .brand .brand-text{display:flex; flex-direction:column; gap:3px; line-height:1.2;}
  .brand .name{font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; line-height:1.2;}
  .brand .ver{font-size:10px; color:var(--text-dim); line-height:1.2;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; font-size:12.5px; color:var(--text-dim); border-left:2px solid transparent; background:none; border-top:none;border-right:none;border-bottom:none; width:100%; text-align:left;}
  .nav-item.active{background:rgba(255,255,255,0.05); color:var(--text); border-left:2px solid var(--mint);}
  .nav-item:hover{color:var(--text);}

  /* mobile top nav toggle + drawer */
  .mobile-nav-toggle{display:none; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid rgba(255,255,255,0.07); background:rgba(255,255,255,0.02);}
  .mobile-nav-toggle button{background:rgba(255,255,255,0.06); border:1px solid var(--card-border); color:var(--text); border-radius:9px; padding:7px 10px; display:flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:11.5px;}
  .mobile-drawer-overlay{position:fixed; inset:0; background:rgba(4,8,7,0.65); z-index:150; display:none;}
  .mobile-drawer-overlay.open{display:block;}
  .mobile-drawer{position:fixed; top:0; left:0; bottom:0; width:78%; max-width:280px; background:#0d1512; border-right:1px solid rgba(255,255,255,0.1); z-index:160; transform:translateX(-100%); transition:transform .22s ease; padding:18px 12px; padding-top:calc(18px + env(safe-area-inset-top,0px)); display:flex; flex-direction:column; gap:2px;}
  .mobile-drawer.open{transform:translateX(0);}

  .content{padding:20px 24px 30px; min-width:0; max-height:78vh; overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none;}
  .content::-webkit-scrollbar{display:none;}
  @media(max-width:680px){ .content{max-height:none;} }

  .crumbs{display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); margin-bottom:16px;}
  .crumbs button{background:none; border:none; color:var(--text-dim); font-size:11px; font-family:'JetBrains Mono',monospace;}
  .crumbs button:hover{color:var(--mint);}
  .crumbs span.sep{color:rgba(255,255,255,0.25);}
  .crumbs span.current{color:var(--text); font-family:'JetBrains Mono',monospace;}

  .profile-card{background:rgba(255,255,255,0.035); border:1px solid var(--card-border); border-radius:16px; padding:16px 18px; display:flex; align-items:flex-start; gap:14px; margin-bottom:14px; flex-wrap:wrap;}
  .avatar-lg{width:52px; height:52px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; color:#04120c; font-family:'JetBrains Mono',monospace; font-size:15px;}
  .profile-name{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;}
  .profile-handle{font-size:11.5px; color:var(--text-dim); margin:2px 0 10px;}
  .fact-row{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--text-dim); margin-top:5px;}
  .fact-row svg{color:var(--mint);}

  .bar{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:12px; padding:11px 14px; margin-bottom:22px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-dim); overflow-x:auto; white-space:nowrap;}
  .bar svg{color:var(--mint); flex:none;}
  .bar .ext{margin-left:auto; color:var(--text-dim); flex:none;}
  .bar.clickable{cursor:pointer;}
  .bar.clickable:hover{background:rgba(255,255,255,0.055);}

  .section-head{display:flex; align-items:center; gap:10px; margin-bottom:4px; flex-wrap:wrap; justify-content:space-between;}
  .section-head h2{font-size:15px; font-weight:700;}
  .section-sub{font-size:11.5px; color:var(--text-dim); margin-bottom:16px;}

  .card-grid{display:grid; grid-template-columns:1fr 1fr;column-gap: 10px;row-gap: 20px;}
  @media(max-width:480px){.card-grid{grid-template-columns:1fr;}}
  .mod-card{display:flex; align-items:flex-start; gap:12px; background:var(--card); border:1px solid var(--card-border); border-radius:13px; padding:13px 14px; transition:background .15s ease, border-color .15s ease; text-align:left; width:100%; color:inherit;}
  .mod-card:hover{background:rgba(255,255,255,0.075); border-color:rgba(255,255,255,0.18);}
  .mod-icon{width:32px; height:32px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.06); color:var(--mint);}
  .mod-title{font-family:'JetBrains Mono',monospace; font-size:12.5px; font-weight:700; color:var(--text);}
  .mod-sub{font-size:11px; color:var(--text-dim); margin-top:3px; display:flex; align-items:center; gap:6px;}
  .dotx{width:6px; height:6px; border-radius:50%; flex:none;}
  .dot-yellow{background:var(--yellow);} .dot-green{background:var(--green);} .dot-red{background:var(--red);} .dot-blue{background:var(--blue);}

  .fm-grid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px;align-items:start;user-select:none;-webkit-user-select:none;}
  .fm-tile{min-width:0;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:12px 7px 10px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--text);text-align:center;cursor:pointer;user-select:none;transition:background .14s,border-color .14s,transform .14s;}
  .fm-tile:hover,.fm-tile:focus-visible{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.1);outline:none;}
  .fm-tile:active{transform:scale(.98);}
  .fm-tile.selected{background:rgba(61,220,151,.11);border-color:rgba(61,220,151,.34);}.fm-tile.mf-drop-folder.drop-target{background:rgba(61,220,151,.2);border-color:var(--mint);box-shadow:0 0 0 2px rgba(61,220,151,.2);}.mf-marquee{position:absolute;z-index:5;display:none;pointer-events:none;border:1px solid var(--mint);background:rgba(61,220,151,.14);border-radius:4px;}
  .fm-name{max-width:100%;font-size:11.5px;line-height:1.35;overflow-wrap:anywhere;}
  .unix-meta{max-width:100%;font:9px/1.35 'JetBrains Mono',monospace;color:var(--text-dim);overflow-wrap:anywhere;}
  .fm-folder-art{width:68px;height:58px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 7px 9px rgba(0,0,0,.26));}
  .fm-folder-art svg{width:68px;height:58px;display:block;}
  .fm-file-art{width:62px;height:58px;display:flex;align-items:center;justify-content:center;color:var(--mint);border-radius:12px;background:linear-gradient(145deg,rgba(61,220,151,.19),rgba(61,220,151,.055));border:1px solid rgba(61,220,151,.2);}
  .fm-file-art svg{width:28px;height:28px;}
  .fm-user-art{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:var(--mint);background:linear-gradient(145deg,rgba(61,220,151,.22),rgba(61,220,151,.06));border:1px solid rgba(61,220,151,.22);}
  .fm-user-art svg{width:25px;height:25px;}
  .fm-context-menu{position:fixed;z-index:400;min-width:178px;padding:5px;background:#101a17;border:1px solid rgba(255,255,255,.13);border-radius:10px;box-shadow:0 14px 38px rgba(0,0,0,.48);display:none;}
  .fm-context-menu.open{display:block;}
  .fm-context-menu button{width:100%;display:flex;align-items:center;gap:9px;padding:9px 10px;border:0;border-radius:7px;background:transparent;color:var(--text);font-size:12px;text-align:left;}
  .fm-context-menu button:hover{background:rgba(255,255,255,.08);}
  .fm-context-menu button.danger{color:var(--red);}
  @media(max-width:560px){.fm-grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px 5px;}.fm-tile{min-height:98px;padding:9px 4px;}.fm-folder-art{width:58px;height:50px;}.fm-folder-art svg{width:58px;height:50px;}.fm-name{font-size:10.5px;}}

  /* generic search result rows */
  .row-list{display:flex; flex-direction:column; gap:10px;}
  .row-card{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:14px 16px; width:100%; text-align:left; color:inherit; cursor:pointer;}
  .row-card:hover{background:rgba(255,255,255,0.075); border-color:rgba(255,255,255,0.18);}
  .row-badge{width:38px; height:38px; border-radius:11px; flex:none; display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12px; color:#04120c;}
  .row-title{font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:6px;}
  .row-sub{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .row-meta{margin-left:auto; display:flex; gap:14px; flex:none;}
  .row-meta .m{text-align:right;}
  .row-meta .m b{display:block; font-family:'JetBrains Mono',monospace; font-size:13px;}
  .row-meta .m span{font-size:9.5px; color:var(--text-dim);}
  .row-chevron{color:var(--text-dim); flex:none;}

  /* linux-desktop-style file action buttons (rename / delete) */
  .file-action-btn{width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09); color:var(--text-dim); flex:none; transition:background .15s ease, color .15s ease, border-color .15s ease;}
  .file-action-btn:hover{background:rgba(255,255,255,0.16); color:var(--text); border-color:rgba(255,255,255,0.24);}
  .file-action-btn.danger:hover{background:rgba(239,91,91,0.16); color:var(--red); border-color:rgba(239,91,91,0.38);}

  /* navigation and read-only notices */
  .back-link{display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--text-dim); background:none; border:none; margin-bottom:14px; padding:4px 0;}
  .back-link:hover{color:var(--mint);}
  .readonly-note{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--text-dim); background:rgba(255,255,255,0.03); border:1px dashed rgba(255,255,255,0.16); border-radius:10px; padding:9px 12px; margin-top:10px;}
  .readonly-note svg{color:var(--yellow); flex:none;}

  .empty-note{font-size:12px; color:var(--text-dim); padding:14px; border:1px dashed rgba(255,255,255,0.14); border-radius:12px; text-align:center;}

  /* filter chips */
  .chips{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .chip-btn{font-family:'JetBrains Mono',monospace; font-size:10.5px; font-weight:600; color:var(--text-dim); background:rgba(255,255,255,0.04); border:1px solid var(--card-border); padding:6px 11px; border-radius:99px;}
  .chip-btn.active{background:rgba(255,255,255,0.14); color:var(--text);}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px;}
  @media(max-width:640px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-box{background:var(--card); border:1px solid var(--card-border); border-radius:13px; padding:13px 14px;}
  .stat-box .n{font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:700;}
  .stat-box .l{font-size:10.5px; color:var(--text-dim); margin-top:3px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; color:var(--text-dim); margin-bottom:6px; font-family:'JetBrains Mono',monospace;}
  .field input[type=text],.field input[type=email],.field input[type=file],.field select{width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--card-border); border-radius:9px; padding:9px 12px; color:var(--text); font-size:12.5px; font-family:'Inter',sans-serif;}
  .field textarea{width:100%; background:rgba(255,255,255,0.04); border:1px solid var(--card-border); border-radius:9px; padding:9px 12px; color:var(--text); font-size:12px; font-family:'JetBrains Mono',monospace; line-height:1.6; resize:vertical; min-height:180px;}
  .hint-note{display:flex; align-items:flex-start; gap:7px; font-size:11px; color:var(--yellow); background:rgba(242,193,78,0.08); border:1px dashed rgba(242,193,78,0.35); border-radius:10px; padding:9px 12px; margin-bottom:14px;}
  .hint-note svg{color:var(--yellow); flex:none; margin-top:1px;}
  .switch-row{display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:12px 14px; margin-bottom:10px;}
  .switch-row .l{font-size:12.5px;} .switch-row .s{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .toggle{width:38px; height:22px; border-radius:99px; background:rgba(255,255,255,0.12); position:relative; border:none; flex:none;}
  .toggle.on{background:var(--mint);}
  .toggle .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#0d1512; transition:left .15s ease;}
  .toggle.on .knob{left:18px; background:#04120c;}


  /* ---------------- modal ---------------- */
  .modal-overlay{position:fixed; inset:0; z-index:200; background:rgba(4,8,7,0.7); display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(4px);}
  .modal-overlay.open{display:flex;}
  .modal{width:100%; max-width:620px; max-height:82vh; background:#0d1512; border:1px solid rgba(255,255,255,0.1); border-radius:18px; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,0.55);}
  .modal-head{display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid rgba(255,255,255,0.08);}
  .modal-title{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13.5px;}
  .modal-meta{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .modal-close{margin-left:auto; background:none; border:none; color:var(--text-dim);}
  .modal-body{padding:16px 18px; overflow:auto; flex:1;}
  .code-box{font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.8; background:rgba(255,255,255,0.03); border-radius:10px; padding:12px 14px; color:#d8e8e0; overflow-x:auto;}
  .code-box .ln{color:rgba(255,255,255,0.28); display:inline-block; width:20px; user-select:none;}
  .kw{color:#f2a6a6;} .fn{color:#8fd3ff;} .st{color:#bfe8bf;} .cm{color:#7f948d;}
  .log-line{font-family:'JetBrains Mono',monospace; font-size:11.5px; padding:7px 0; border-bottom:1px dashed rgba(255,255,255,0.06); display:flex; gap:10px; align-items:flex-start;}
  .log-line:last-child{border-bottom:none;}
  .log-ok{color:var(--green);} .log-warn{color:var(--yellow);} .log-err{color:var(--red);}
  .list-item{padding:9px 0; border-bottom:1px dashed rgba(255,255,255,0.06); font-size:12px;}
  .list-item:last-child{border-bottom:none;}
  .list-item .t{font-weight:600; font-family:'JetBrains Mono',monospace;}
  .list-item .s{color:var(--text-dim); font-size:11px; margin-top:2px;}
  button.list-item{width:100%; text-align:left; background:none; border:none; color:inherit; border-bottom:1px dashed rgba(255,255,255,0.06); border-radius:8px;}
  button.list-item:hover{background:rgba(255,255,255,0.05);}
  .modal-foot{display:flex; gap:10px; padding:14px 18px; border-top:1px solid rgba(255,255,255,0.08); flex-wrap:wrap;}

let mfMarqueeStart=null;
function mfStartMarquee(event){
  if(event.button!==0||event.target!==event.currentTarget) return;
  const grid=event.currentTarget, rect=grid.getBoundingClientRect();
  mfMarqueeStart={grid,x:event.clientX-rect.left,y:event.clientY-rect.top};
  document.querySelectorAll('#body .fm-grid .fm-tile.selected').forEach(tile=>tile.classList.remove('selected'));
  const box=grid.querySelector('.mf-marquee');
  box.style.display='block'; box.style.left=mfMarqueeStart.x+'px'; box.style.top=mfMarqueeStart.y+'px'; box.style.width='0'; box.style.height='0';
  event.preventDefault();
}
function mfUpdateMarquee(event){
  if(!mfMarqueeStart||mfMarqueeStart.grid!==event.currentTarget) return;
  const rect=mfMarqueeStart.grid.getBoundingClientRect(), x=event.clientX-rect.left, y=event.clientY-rect.top;
  const left=Math.min(x,mfMarqueeStart.x), top=Math.min(y,mfMarqueeStart.y), width=Math.abs(x-mfMarqueeStart.x), height=Math.abs(y-mfMarqueeStart.y);
  const box=mfMarqueeStart.grid.querySelector('.mf-marquee');
  Object.assign(box.style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'});
  const area={left:rect.left+left,right:rect.left+left+width,top:rect.top+top,bottom:rect.top+top+height};
  mfMarqueeStart.grid.querySelectorAll('.fm-tile').forEach(tile=>{
    const r=tile.getBoundingClientRect();
    tile.classList.toggle('selected',r.right>=area.left&&r.left<=area.right&&r.bottom>=area.top&&r.top<=area.bottom);
  });
}
function mfEndMarquee(){
  if(!mfMarqueeStart) return;
  const box=mfMarqueeStart.grid.querySelector('.mf-marquee');

}

function mfDropOnFolder(event,targetId){
  if(!requireCurrentUserPermission('w')) return;
  const target=mfFind(myFolderTree,targetId);
  if(!target||target.type!=='folder') return;
  event.preventDefault(); event.stopPropagation(); event.currentTarget.classList.remove('drop-target');
  let ids=[];
  try{ ids=JSON.parse(event.dataTransfer.getData('text/plain')||'[]'); }catch(error){ return; }
  const source=mfCurrentFolder();
  if(!source||!ids.length) return;
  if(ids.includes(targetId)||ids.some(id=>{ const node=mfFind(source,id); return node&&node.type==='folder'&&mfFind(node,targetId); })){
    showToast('ย้ายโฟลเดอร์เข้าไปในตัวเองไม่ได้'); return;
  }
  const moving=source.children.filter(node=>ids.includes(node.id));
  if(!moving.length||target===source) return;
  for(let i=source.children.length-1;i>=0;i--){if(ids.includes(source.children[i].id)) source.children.splice(i,1);}
  moving.forEach(node=>{ node.name=uniqueFolderName(target,node.name); target.children.push(node); });
  persistSharedState(); renderContent();
  showToast('ย้าย '+moving.length+' รายการเข้า "'+target.name+'" แล้ว');
}

  function finish(save){
    if(finished) return;
    finished=true;
    if(save&&!requireCurrentUserPermission('w')){ renderContent(); return; }
    const value=inp.value.trim();
    if(save&&value&&/[\\/]/.test(value)){
      showToast('ชื่อห้ามมีเครื่องหมาย / หรือ \\');

  }
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();finish(true);} if(e.key==='Escape'){e.preventDefault();finish(false);} };

const AVATAR_PALETTE = ['#3ddc97','#5aa9ff','#f2c14e','#c9a6ff','#ff9f7a','#7ad6d6'];
function studentColor(id){ let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0; return AVATAR_PALETTE[h%AVATAR_PALETTE.length]; }
/* aggregated views (student) ---------- */
let sharedFolderTreeId=null;
let sharedFolderPathIds=[];
function collectSharedUserEntries(){
  const out=[];
  function walk(node, trail, tree){
    (node.children||[]).forEach(child=>{
      if(child.perm==='view'||child.perm==='copy') out.push({node:child, path:trail.concat(child.id), tree, owner:tree.owner||ROLES.student.name});
      if(child.type==='folder') walk(child, trail.concat(child.id), tree);
    });
  }
  const trees=[myFolderTree,homeDirectoryTree,...Object.values(userFolderTrees)];
  trees.forEach(tree=>{
    if(tree.perm==='view'||tree.perm==='copy') out.push({node:tree,path:[tree.id],tree,owner:tree.owner||ROLES.student.name});
    walk(tree,[tree.id],tree);
  });
  return out;
}
function sharedTreeById(id){
  return [myFolderTree,homeDirectoryTree,...Object.values(userFolderTrees)].find(tree=>tree.id===id)||null;
}
function sharedTreeRoots(){
  const entries=collectSharedUserEntries();
  return [myFolderTree,homeDirectoryTree,...Object.values(userFolderTrees)].filter(tree=>entries.some(item=>item.tree===tree));
}
function sharedCopyableNode(node){
  if(node.type!=='folder') return node.perm==='copy'?cloneFolderNode(node):null;
  const children=(node.children||[]).filter(child=>child.perm==='view'||child.perm==='copy').map(sharedCopyableNode).filter(Boolean);
  if(node.perm==='copy'){
    const clone=cloneFolderNode(node);
    clone.children=children;
    return clone;
  }
  return children.length?{id:'shared_path_'+node.id,name:node.name,type:'folder',perm:'private',children}:null;
}
function sharedCopyableTreeItems(tree){
  if(tree.perm==='copy'){
    const root=sharedCopyableNode(tree);
    return root?[root]:[];
  }
  return (tree.children||[]).map(sharedCopyableNode).filter(Boolean);
}
function copySharedTreesContents(event,treeIds){
  if(event) event.stopPropagation();
  if(!requireCurrentUserPermission('r')||!requireCurrentUserPermission('x')) return;
  const items=(treeIds||[]).flatMap(id=>{
    const tree=sharedTreeById(id);

function findAdminTreeNode(node,id){

      else counts.files++;

let adminMarqueeStart=null;
function adminStartMarquee(event){
  if(event.button!==0||event.target!==event.currentTarget) return;
  const grid=event.currentTarget, rect=grid.getBoundingClientRect();
  adminMarqueeStart={grid,x:event.clientX-rect.left,y:event.clientY-rect.top};
  grid.querySelectorAll('.fm-tile.selected').forEach(tile=>tile.classList.remove('selected'));
  const box=grid.querySelector('.mf-marquee');
  box.style.display='block'; box.style.left=adminMarqueeStart.x+'px'; box.style.top=adminMarqueeStart.y+'px'; box.style.width='0'; box.style.height='0';
  event.preventDefault();
}
function adminUpdateMarquee(event){
  if(!adminMarqueeStart||adminMarqueeStart.grid!==event.currentTarget) return;
  const rect=adminMarqueeStart.grid.getBoundingClientRect(), x=event.clientX-rect.left, y=event.clientY-rect.top;
  const left=Math.min(x,adminMarqueeStart.x), top=Math.min(y,adminMarqueeStart.y), width=Math.abs(x-adminMarqueeStart.x), height=Math.abs(y-adminMarqueeStart.y);
  const box=adminMarqueeStart.grid.querySelector('.mf-marquee');
  Object.assign(box.style,{left:left+'px',top:top+'px',width:width+'px',height:height+'px'});
  const area={left:rect.left+left,right:rect.left+left+width,top:rect.top+top,bottom:rect.top+top+height};
  adminMarqueeStart.grid.querySelectorAll('.fm-tile').forEach(tile=>{
    const r=tile.getBoundingClientRect();
    tile.classList.toggle('selected',r.right>=area.left&&r.left<=area.right&&r.bottom>=area.top&&r.top<=area.bottom);
  });
}

  if(!adminMarqueeStart) return;

function adminDropOnFolder(event,targetId){
  const target=findAdminTreeNode(adminFilesTree,targetId);
  if(!target||target.type!=='folder') return;
  event.preventDefault(); event.stopPropagation(); event.currentTarget.classList.remove('drop-target');
  let ids=[]; try{ids=JSON.parse(event.dataTransfer.getData('text/plain')||'[]');}catch(error){return;}
  const source=adminCurrentFileFolder();
  if(!source||!ids.length) return;
  if(ids.includes(targetId)||ids.some(id=>{const node=findAdminTreeNode(source,id);return node&&node.type==='folder'&&findAdminTreeNode(node,targetId);})){showToast('ย้ายโฟลเดอร์เข้าไปในตัวเองไม่ได้');return;}
  const moving=source.children.filter(node=>ids.includes(node.id));
  if(!moving.length||target===source) return;
  for(let i=source.children.length-1;i>=0;i--){if(ids.includes(source.children[i].id)) source.children.splice(i,1);}
  moving.forEach(node=>{node.name=uniqueFolderName(target,node.name);target.children.push(node);});
  persistSharedState(); renderContent(); showToast('ย้าย '+moving.length+' รายการเข้า "'+target.name+'" แล้ว');
}

    +'<div class="section-head" style="margin-top:22px;"><h2>Shell Scripts</h2></div><div class="section-sub">กดเพื่อดูรายละเอียด</div>'
    +'<div class="card-grid">'+SHELL_SCRIPTS.map((s,i)=>'<button class="mod-card" onclick="openViewer(\'script\','+i+')"><div class="mod-icon">'+icon('archive',16)+'</div><div><div class="mod-title">'+s.t+'</div><div class="mod-sub">'+s.s+'</div></div></button>').join('')+'</div>';
}
function renderBackup(){
  const rows = LOG_LINES.filter(l=>l.text.includes('backup') || l.text.includes('สำรอง')).map(l=>'<div class="log-line log-'+l.tag+'">'+icon(l.tag==='ok'?'check':l.tag==='warn'?'alert':'x',13)+'<span>'+l.text+'</span></div>').join('');
  return '<div class="stat-grid">'
    +'<div class="stat-box"><div class="n">03:00:11</div><div class="l">Backup ล่าสุด</div></div>'
    +'<div class="stat-box"><div class="n">4.2 GB</div><div class="l">ขนาดล่าสุด</div></div>'
    +'<div class="stat-box"><div class="n">137 GB</div><div class="l">รวม Backup ทั้งหมด</div></div>'
    +'<div class="stat-box"><div class="n">sha256</div><div class="l">ตรวจสอบทุกครั้ง</div></div></div>'
    +'<div class="section-head"><h2>ประวัติ Backup</h2><button class="btn primary" onclick="runBackupNow()">'+icon('archive',13)+' Backup Now</button></div><div class="section-sub">0 3 * * * ทุกวัน · ลบไฟล์เก่าตามนโยบายที่กำหนด</div>'+rows;
}
function runBackupNow(){
  showToast('กำลังรัน backup.sh ผ่าน SSH...');
  setTimeout(()=>showToast('backup.sh ทำงานสำเร็จ (จำลอง)'), 1200);
}
function renderLog(){
  const chips=[['all','ทั้งหมด'],['ok','สำเร็จ'],['warn','เฝ้าระวัง'],['err','ผิดพลาด']];
  const filtered = LOG_LINES.filter(l=>logFilter==='all'||l.tag===logFilter);
  const rows = filtered.map(l=>'<div class="log-line log-'+l.tag+'">'+icon(l.tag==='ok'?'check':l.tag==='warn'?'alert':'x',13)+'<span>'+l.text+'</span></div>').join('');
  return '<div class="section-head"><h2>System Log</h2></div><div class="section-sub">/opt/student-code-hub/logs</div>'
    +'<div class="chips">'+chips.map(c=>'<button class="chip-btn'+(logFilter===c[0]?' active':'')+'" onclick="setLogFilter(\''+c[0]+'\')">'+c[1]+'</button>').join('')+'</div>'
    +(rows||'<div class="empty-note">ไม่มีเหตุการณ์ในหมวดนี้</div>');
}
function setLogFilter(f){ logFilter=f; renderContent(); }

/* ---------- settings ---------- */
let autoBackupOn = true;
function renderSettings(role){
  return '<div class="section-head"><h2>ตั้งค่า</h2></div><div class="section-sub">ข้อมูลบัญชีและการแจ้งเตือน</div>'
    +'<div class="field"><label>ชื่อผู้ใช้</label><input type="text" id="settingsUsername" value="'+role.name+'"></div>'
    +'<div class="field"><label>อีเมลติดต่อ</label><input type="email" id="settingsEmail" value="'+role.name+'@university.ac.th"></div>'
    +'<div class="switch-row"><div><div class="l">สำรองข้อมูลอัตโนมัติ</div><div class="s">รัน backup.sh ทุกวันเวลา 03:00</div></div><button class="toggle'+(autoBackupOn?' on':'')+'" id="toggleBackup" onclick="toggleSetting(\'backup\')"><span class="knob"></span></button></div>'
    +'<button class="btn primary" style="margin-top:10px;" onclick="showToast(\'บันทึกการตั้งค่าแล้ว\')">บันทึกการตั้งค่า</button>';
}
function toggleSetting(which){
  autoBackupOn=!autoBackupOn; document.getElementById('toggleBackup').classList.toggle('on',autoBackupOn);
}

/* ================= modal / viewer ================= */
function openViewer(kind, ref){
  if(kind!=='script') return;
  const overlay=document.getElementById('modalOverlay');
  const titleEl=document.getElementById('modalTitle'), metaEl=document.getElementById('modalMeta'), iconEl=document.getElementById('modalIcon'), bodyEl=document.getElementById('modalBody'), footEl=document.getElementById('modalFoot');
  footEl.innerHTML='';
  const s=SHELL_SCRIPTS[ref];
  if(!s) return;
  titleEl.textContent=s.t; metaEl.textContent='/opt/student-code-hub/scripts'; iconEl.innerHTML=icon('archive',16);
  bodyEl.innerHTML='<div class="list-item"><div class="t">คำสั่งหลัก</div><div class="s">'+s.s+'</div></div>';
  footEl.innerHTML='<button class="btn ghost" onclick="closeModal()">ปิด</button>';
  overlay.classList.add('open');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
document.getElementById('modalCloseBtn').addEventListener('click',closeModal);
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
document.addEventListener('click',closeFmContextMenu);
document.addEventListener('mouseup',mfEndMarquee);
document.addEventListener('mouseup',adminEndMarquee);
document.addEventListener('keydown',handleMyFolderClipboardShortcut);
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeFmContextMenu();});

function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

const SHARED_STATE_KEY='student-code-hub.shared-state.v2';
let sharedStateHydrating=false;
function persistSharedState(){
  try{
    localStorage.setItem(SHARED_STATE_KEY,JSON.stringify({myFolderTree,userFolderTrees,homeDirectoryTree,userPermissionRestrictions}));
  }catch(error){ /* local file storage may be unavailable in some browser modes */ }
}
function hydrateSharedState(){
  try{
    const raw=localStorage.getItem(SHARED_STATE_KEY);
    if(!raw) return;
    const saved=JSON.parse(raw);
    if(saved.myFolderTree) myFolderTree=saved.myFolderTree;
    if(saved.userFolderTrees) userFolderTrees=saved.userFolderTrees;
    if(saved.homeDirectoryTree) homeDirectoryTree=saved.homeDirectoryTree;
    if(saved.userPermissionRestrictions) userPermissionRestrictions=Object.assign(Object.create(null),saved.userPermissionRestrictions);
    myFolderTree.owner=ROLES.student.name;
    homeDirectoryTree.owner=ROLES.student.name;
    Object.keys(userFolderTrees).forEach(username=>{ userFolderTrees[username].owner=username; });
    if(!mfFind(myFolderTree,myFolderPathIds[myFolderPathIds.length-1])) myFolderPathIds=['mf_root'];
    adminFilesTree=null;
  }catch(error){ /* ignore invalid or unavailable browser storage */ }
}
window.addEventListener('storage',event=>{
  if(event.key!==SHARED_STATE_KEY) return;
  sharedStateHydrating=true;
  hydrateSharedState();
  renderContent();
  sharedStateHydrating=false;
});

hydrateSharedState();
seedDemoUsers();
renderRole();
</script>
